name: Build Windows installer & publish release

on:
  push:
    branches: [arena/bb96a786-codepharm]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build renderer
        run: npm run build:renderer
      - name: Build electron
        run: npm run build:electron
      - name: Package installer (NSIS)
        run: npx electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: codepharm-installer-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
      - name: Delete existing 'latest' release (to re-upload)
        if: github.ref == 'refs/heads/arena/bb96a786-codepharm'
        uses: dev-drprasad/delete-older-releases@v0.3.2
        with:
          keep_latest: 0
          delete_tag_pattern: latest
          repo_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish rolling release on branch push
        if: github.ref == 'refs/heads/arena/bb96a786-codepharm'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "CodEPharm — آخرین نسخه"
          prerelease: false
          body: |
            این نسخه به‌صورت خودکار از آخرین کد ساخته شده است.

            - برای نصب، فایل exe را دانلود و اجرا کنید.
            - اطلاعات داروخانه در پوشه کاربری شما ذخیره می‌شود و با نصب/حذف برنامه پاک نمی‌شود.
            - برای تغییرات جدید، کافیست روی این صفحه بروید و نسخه جدید را دانلود کنید.
          files: release/*.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "CodEPharm ${{ github.ref_name }}"
          generate_release_notes: true
          files: release/*.exe
