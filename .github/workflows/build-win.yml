name: Build Windows installer & publish release

on:
  push:
    branches: [arena/bb96a786-codepharm]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build renderer
        run: npm run build:renderer
      - name: Build electron
        run: npm run build:electron
      - name: Package installer (NSIS)
        run: npx electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: codepharm-installer-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
      - name: Publish rolling release
        if: github.ref == 'refs/heads/arena/bb96a786-codepharm'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "CodEPharm — آخرین نسخه (خودکار)"
          prerelease: false
          body: |
            این نسخه به‌صورت خودکار از آخرین کامیت ساخته شده است.

            **نصب:** فایل exe پایین را دانلود و اجرا کنید. داده‌های برنامه در پوشه کاربری ذخیره می‌شود و با نصب/حذف پاک نمی‌گردد.

            **پیش‌نمایش آنلاین:** https://mhdyhn20.github.io/CodEPharm-/
          files: release/*.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "CodEPharm ${{ github.ref_name }}"
          generate_release_notes: true
          files: release/*.exe
