name: Build Windows installer & publish release

on:
  push:
    branches: [arena/bb96a786-codepharm]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build renderer
        run: npm run build:renderer
      - name: Build electron
        run: npm run build:electron
      - name: Package installer (NSIS)
        run: npx electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: codepharm-installer-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
      - name: Publish to GitHub Releases (latest tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
      - name: Publish rolling release on branch push
        if: github.ref == 'refs/heads/arena/bb96a786-codepharm'
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          title: "CodEPharm — آخرین نسخه (خودکار)"
          prerelease: false
          files: |
            release/*.exe
